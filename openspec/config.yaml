# OpenSpec project context for RoadmapControl
project:
  name: RoadmapControl
  repository: https://github.com/AndySabina/RoadmapControl
  lifecycle: bootstrap
  description: >-
    A Go-based roadmap control system with GitHub Actions, YAML configuration,
    JSON Schema validation, and Pi/OpenCode adapters.

technology:
  primary_language: Go
  automation: GitHub Actions
  configuration_format: YAML
  schema_format: JSON Schema
  adapters:
    - Pi
    - OpenCode
  supported_platforms:
    - Linux
    - WSL2
    - macOS

testing:
  strict_tdd: true
  runner: Go
  command: GOTOOLCHAIN=go1.27.1 go test ./...
  status: in_progress
  notes: >-
    The Go module, test files, and CI workflow are present. This configuration
    records the available test command; it does not assert a test run today.

phase_rules:
  proposal:
    required: true
  spec:
    required: true
  design:
    required: true
  tasks:
    required: true
  apply:
    requires:
      - proposal
      - spec
      - design
      - tasks
    strict_tdd: true
  verify:
    requires:
      - spec
      - tasks
      - apply
    strict_tdd: true
  archive:
    requires:
      - verify

delivery:
  strategy: ask-on-risk
  review_changed_lines_budget: 400
  commit_or_push_during_init: false

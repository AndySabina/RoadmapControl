name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026e3f722fe0da7ef32d
        with:
          go-version: 1.27.1
      - name: Test
        run: go test ./...
